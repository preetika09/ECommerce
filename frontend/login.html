<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Header Brand Nav -->
  <nav class="navbar border-bottom bg-body">
    <div class="container justify-content-between">
      <a class="navbar-brand brand-logo" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>
      <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
              <i class="fa-solid fa-right-to-bracket fa-2x"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted">Sign in to your ShopVerse account to continue shopping</p>
          </div>

          <!-- Alert error banner -->
          <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="loginId" class="form-label fw-semibold">Email address or Username</label>
              <div class="input-group">
                <span class="input-group-text bg-body-tertiary"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="text" class="form-control" id="loginId" placeholder="user@shopverse.com" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold mb-0">Password</label>
                <a href="#" class="small text-primary">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-body-tertiary"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Sign In</button>
          </form>

          <div class="p-3 bg-body-tertiary rounded-3 mb-4 small text-muted">
            <span class="fw-bold text-dark">Quick Demo Credentials:</span><br>
            • Customer: <code>user@shopverse.com</code> / <code>password123</code><br>
            • Admin: <code>admin@shopverse.com</code> / <code>admin123</code>
          </div>

          <div class="text-center">
            <p class="mb-0 text-muted">Don't have an account? <a href="/register.html" class="fw-bold text-primary">Register Here</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-muted border-top small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
