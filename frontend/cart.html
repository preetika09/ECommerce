<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="main-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand-logo me-4" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>

      <form class="d-flex mx-auto search-input-group flex-grow-1 max-w-600 me-lg-4" id="global-search-form" style="max-width: 550px;">
        <input class="form-control" type="search" id="global-search-input" placeholder="Search across 100+ items..." autocomplete="off">
        <button class="btn btn-search" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        <div id="search-suggestions-box" class="search-suggestions"></div>
      </form>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="d-flex align-items-center ms-auto gap-3 py-2 py-lg-0">
          <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
          <a href="/wishlist.html" class="nav-icon-btn"><i class="fa-solid fa-heart"></i><span class="badge-count" id="wishlist-badge-count" style="display:none;">0</span></a>
          <a href="/cart.html" class="nav-icon-btn text-primary"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cart-badge-count" style="display:none;">0</span></a>
          <div id="auth-nav-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h3 class="fw-bold mb-4"><i class="fa-solid fa-cart-shopping text-primary me-2"></i>Your Shopping Cart</h3>

    <div class="row g-4" id="cart-main-container">
      <!-- Loaded dynamically via cart.js -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading your cart items...</p>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-white text-center mt-auto small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
