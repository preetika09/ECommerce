<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="main-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand-logo me-4" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="d-flex align-items-center ms-auto gap-3 py-2 py-lg-0">
          <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
          <a href="/orders.html" class="btn btn-outline-primary btn-sm fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i>Back to My Orders</a>
          <div id="auth-nav-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div id="single-order-details-container">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading order invoice details...</p>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-white text-center mt-auto small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
