<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="main-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand-logo me-4" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="d-flex align-items-center ms-auto gap-3 py-2 py-lg-0">
          <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
          <a href="/wishlist.html" class="nav-icon-btn"><i class="fa-solid fa-heart"></i><span class="badge-count" id="wishlist-badge-count" style="display:none;">0</span></a>
          <a href="/cart.html" class="nav-icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cart-badge-count" style="display:none;">0</span></a>
          <div id="auth-nav-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">
      
      <!-- User Sidebar Card -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
          <div class="position-relative d-inline-block mx-auto mb-3">
            <img id="profile-avatar-img" src="/images/default-avatar.png" class="rounded-circle border border-primary p-1 shadow-sm" style="width: 110px; height: 110px; object-fit: cover;">
          </div>
          <h4 class="fw-bold mb-1" id="profile-display-name">User Name</h4>
          <p class="text-muted small mb-3" id="profile-display-email">user@shopverse.com</p>

          <div class="list-group list-group-flush text-start border-top pt-3">
            <a href="/orders.html" class="list-group-item list-group-item-action border-0 fw-semibold py-2">
              <i class="fa-solid fa-box text-success me-2"></i>My Orders
            </a>
            <a href="/wishlist.html" class="list-group-item list-group-item-action border-0 fw-semibold py-2">
              <i class="fa-solid fa-heart text-danger me-2"></i>Wishlist
            </a>
            <a href="#" onclick="logoutUser()" class="list-group-item list-group-item-action border-0 fw-semibold py-2 text-danger">
              <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
            </a>
          </div>
        </div>
      </div>

      <!-- User Forms Column -->
      <div class="col-lg-8">
        
        <!-- Personal Info Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-pen text-primary me-2"></i>Personal Details</h5>
          <form id="profile-info-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="profileName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="profileName" required>
              </div>
              <div class="col-md-6">
                <label for="profilePhone" class="form-label fw-semibold">Phone Number</label>
                <input type="tel" class="form-control" id="profilePhone">
              </div>
              <div class="col-md-12">
                <label for="profileImage" class="form-label fw-semibold">Profile Avatar Image URL</label>
                <input type="url" class="form-control" id="profileImage" placeholder="https://images.unsplash.com/photo-...">
              </div>
            </div>
            <div class="mt-3 text-end">
              <button type="submit" class="btn btn-primary fw-bold">Save Changes</button>
            </div>
          </form>
        </div>

        <!-- Change Password Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-key text-warning me-2"></i>Change Password</h5>
          <form id="change-password-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
                <input type="password" class="form-control" id="currentPassword" required>
              </div>
              <div class="col-md-6">
                <label for="newPassword" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control" id="newPassword" required minlength="6">
              </div>
            </div>
            <div class="mt-3 text-end">
              <button type="submit" class="btn btn-warning fw-bold text-dark">Update Password</button>
            </div>
          </form>
        </div>

        <!-- Address Book -->
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-map-location-dot text-info me-2"></i>Saved Addresses</h5>
          </div>
          <div id="profile-addresses-list" class="vstack gap-3">
            <!-- Rendered dynamically -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <footer class="py-4 bg-dark text-white text-center mt-auto small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
