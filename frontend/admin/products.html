<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-logo text-white" href="/admin/dashboard.html">
        <i class="fa-solid fa-gauge me-2"></i>ShopVerse <span class="badge bg-warning text-dark fs-6 ms-2">Admin Panel</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-store me-1"></i>View Storefront</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon text-white"></i></button>
        <button onclick="logoutUser()" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 my-4">
    <div class="row g-4">

      <aside class="col-lg-2">
        <div class="card border-0 shadow-sm rounded-4 p-3 vstack gap-2">
          <a href="/admin/dashboard.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
          <a href="/admin/products.html" class="btn btn-primary text-start fw-bold"><i class="fa-solid fa-boxes-stacked me-2"></i>Products CRUD</a>
          <a href="/admin/orders.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-truck-ramp-box me-2"></i>Orders Manager</a>
          <a href="/admin/users.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-users me-2"></i>Users & Roles</a>
        </div>
      </aside>

      <main class="col-lg-10">
        
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
              <h4 class="fw-bold mb-0">Product Catalog Inventory</h4>
              <span class="text-muted small">Add, Edit, Update Stock, and Delete Products</span>
            </div>
            <button class="btn btn-primary fw-bold" onclick="openAddProductModal()"><i class="fa-solid fa-plus me-2"></i>Add New Product</button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Brand</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-products-tbody">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div>
  </div>

  <!-- Product Modal (Add/Edit) -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="product-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="productModalTitle">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body vstack gap-3">
            <input type="hidden" id="pm-id">
            
            <div class="row g-3">
              <div class="col-md-6">
                <label for="pm-name" class="form-label fw-semibold">Product Name</label>
                <input type="text" class="form-control" id="pm-name" required>
              </div>
              <div class="col-md-6">
                <label for="pm-brand" class="form-label fw-semibold">Brand</label>
                <input type="text" class="form-control" id="pm-brand" required>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="pm-category" class="form-label fw-semibold">Category</label>
                <select class="form-select" id="pm-category" required>
                  <option value="Women's Fashion">Women's Fashion</option>
                  <option value="Men's Fashion">Men's Fashion</option>
                  <option value="Kids & Baby">Kids & Baby</option>
                  <option value="Shoes & Footwear">Shoes & Footwear</option>
                  <option value="Bags & Luggage">Bags & Luggage</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                  <option value="Home & Kitchen">Home & Kitchen</option>
                  <option value="Furniture">Furniture</option>
                  <option value="Grocery">Grocery</option>
                  <option value="Sports & Fitness">Sports & Fitness</option>
                  <option value="Books">Books</option>
                  <option value="Toys & Games">Toys & Games</option>
                  <option value="Pet Supplies">Pet Supplies</option>
                  <option value="Watches">Watches</option>
                  <option value="Dresses">Dresses</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="pm-subcategory" class="form-label fw-semibold">Subcategory</label>
                <input type="text" class="form-control" id="pm-subcategory" placeholder="e.g. Shirts, Sneakers">
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-4">
                <label for="pm-price" class="form-label fw-semibold">Discounted Price (₹)</label>
                <input type="number" class="form-control" id="pm-price" required>
              </div>
              <div class="col-md-4">
                <label for="pm-originalPrice" class="form-label fw-semibold">Original Price (₹)</label>
                <input type="number" class="form-control" id="pm-originalPrice" required>
              </div>
              <div class="col-md-4">
                <label for="pm-stock" class="form-label fw-semibold">Stock Quantity</label>
                <input type="number" class="form-control" id="pm-stock" required min="0">
              </div>
            </div>

            <div>
              <label for="pm-description" class="form-label fw-semibold">Description</label>
              <textarea class="form-control" id="pm-description" rows="3" required></textarea>
            </div>

            <div>
              <label for="pm-images" class="form-label fw-semibold">Image URLs (comma separated) OR File Upload</label>
              <input type="text" class="form-control mb-2" id="pm-images" placeholder="https://images.unsplash.com/...">
              <input type="file" class="form-control" id="pm-file-upload" multiple accept="image/*">
              <small class="text-muted">You can upload images via Multer file uploader.</small>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary fw-bold">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAdminProducts();
    });
  </script>
</body>
</html>
