<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-logo text-white" href="/admin/dashboard.html">
        <i class="fa-solid fa-gauge me-2"></i>ShopVerse <span class="badge bg-warning text-dark fs-6 ms-2">Admin Panel</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-store me-1"></i>View Storefront</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon text-white"></i></button>
        <button onclick="logoutUser()" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 my-4">
    <div class="row g-4">

      <aside class="col-lg-2">
        <div class="card border-0 shadow-sm rounded-4 p-3 vstack gap-2">
          <a href="/admin/dashboard.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
          <a href="/admin/products.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-boxes-stacked me-2"></i>Products CRUD</a>
          <a href="/admin/orders.html" class="btn btn-primary text-start fw-bold"><i class="fa-solid fa-truck-ramp-box me-2"></i>Orders Manager</a>
          <a href="/admin/users.html" class="btn btn-outline-secondary text-start border-0 fw-semibold"><i class="fa-solid fa-users me-2"></i>Users & Roles</a>
        </div>
      </aside>

      <main class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h4 class="fw-bold mb-3">Order Management & Delivery Tracker</h4>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Order Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-orders-tbody">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Status Update Modal -->
  <div class="modal fade" id="orderStatusModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="order-status-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Update Order Status</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body vstack gap-3">
            <input type="hidden" id="osm-order-id">
            <div>
              <label class="form-label fw-semibold">Order Status</label>
              <select class="form-select" id="osm-status">
                <option value="Order Placed">Order Placed</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Packed">Packed</option>
                <option value="Shipped">Shipped</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
            <div>
              <label class="form-label fw-semibold">Payment Status</label>
              <select class="form-select" id="osm-payment">
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Failed">Failed</option>
                <option value="Refunded">Refunded</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary fw-bold">Update Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAdminOrders();
    });
  </script>
</body>
</html>
