<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Catalog - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="top-announcement-bar text-center">
    <div class="container">
      <span>🚀 Fast Delivery Across All Cities | Free Return Within 30 Days</span>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="main-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand-logo me-4" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>

      <form class="d-flex mx-auto search-input-group flex-grow-1 max-w-600 me-lg-4" id="global-search-form" style="max-width: 550px;">
        <input class="form-control" type="search" id="global-search-input" placeholder="Search across 100+ items..." autocomplete="off">
        <button class="btn btn-search" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        <div id="search-suggestions-box" class="search-suggestions"></div>
      </form>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="d-flex align-items-center ms-auto gap-3 py-2 py-lg-0">
          <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
          <a href="/wishlist.html" class="nav-icon-btn"><i class="fa-solid fa-heart"></i><span class="badge-count" id="wishlist-badge-count" style="display:none;">0</span></a>
          <a href="/cart.html" class="nav-icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cart-badge-count" style="display:none;">0</span></a>
          <div id="auth-nav-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
        <li class="breadcrumb-item active" id="breadcrumb-current">All Products</li>
      </ol>
    </nav>

    <div class="row g-4">

      <!-- Sidebar Filters -->
      <aside class="col-lg-3">
        <div class="filter-sidebar">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-filter text-primary me-2"></i>Filters</h5>
            <button class="btn btn-link btn-sm text-decoration-none text-muted p-0" onclick="resetFilters()">Clear All</button>
          </div>
          <hr>

          <!-- Category Filter -->
          <div class="mb-4">
            <div class="filter-group-title">Category</div>
            <select class="form-select form-select-sm" id="filter-category" onchange="applyFilters()">
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Subcategory Filter -->
          <div class="mb-4" id="subcategory-filter-box" style="display: none;">
            <div class="filter-group-title">Subcategory</div>
            <select class="form-select form-select-sm" id="filter-subcategory" onchange="applyFilters()">
              <option value="">All Subcategories</option>
            </select>
          </div>

          <!-- Price Filter -->
          <div class="mb-4">
            <div class="filter-group-title">Price Range (₹)</div>
            <div class="d-flex gap-2 align-items-center">
              <input type="number" class="form-control form-control-sm" id="filter-min-price" placeholder="Min" onchange="applyFilters()">
              <span>-</span>
              <input type="number" class="form-control form-control-sm" id="filter-max-price" placeholder="Max" onchange="applyFilters()">
            </div>
          </div>

          <!-- Brands Filter -->
          <div class="mb-4">
            <div class="filter-group-title">Brands</div>
            <div id="brands-checkbox-list" class="vstack gap-1 max-vh-30 overflow-y-auto">
              <!-- Rendered via script -->
            </div>
          </div>

          <!-- Rating Filter -->
          <div class="mb-4">
            <div class="filter-group-title">Minimum Rating</div>
            <div class="vstack gap-1">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="r4" value="4" onchange="applyFilters()">
                <label class="form-check-label small" for="r4">4★ & above</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="r3" value="3" onchange="applyFilters()">
                <label class="form-check-label small" for="r3">3★ & above</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="rAll" value="" checked onchange="applyFilters()">
                <label class="form-check-label small" for="rAll">All Ratings</label>
              </div>
            </div>
          </div>

          <!-- Stock Filter -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="filter-in-stock" onchange="applyFilters()">
            <label class="form-check-label small fw-semibold" for="filter-in-stock">Exclude Out of Stock</label>
          </div>

        </div>
      </aside>

      <!-- Main Product Catalog -->
      <section class="col-lg-9">

        <!-- Header Controls -->
        <div class="card border-0 shadow-sm p-3 mb-4 rounded-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <h4 class="fw-bold mb-1" id="catalog-title">Shop Verse Catalog</h4>
              <span class="text-muted small" id="results-count-text">Showing products...</span>
            </div>

            <div class="d-flex align-items-center gap-3 ms-auto">
              <!-- Sort Dropdown -->
              <div class="d-flex align-items-center gap-2">
                <label for="sort-select" class="small fw-bold text-nowrap">Sort By:</label>
                <select class="form-select form-select-sm" id="sort-select" onchange="applyFilters()">
                  <option value="newest">Newest Arrivals</option>
                  <option value="popularity">Popularity</option>
                  <option value="price_asc">Price: Low to High</option>
                  <option value="price_desc">Price: High to Low</option>
                  <option value="rating">Customer Rating</option>
                  <option value="discount">Biggest Discount</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="products-catalog-grid">
          <!-- Rendered via script -->
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center mt-5">
          <nav>
            <ul class="pagination shadow-sm" id="catalog-pagination">
              <!-- Rendered via script -->
            </ul>
          </nav>
        </div>

      </section>
    </div>
  </main>

  <footer class="py-4 bg-dark text-white text-center mt-auto small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
