<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Showcase - ShopVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="main-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand-logo me-4" href="/index.html">
        <i class="fa-solid fa-bag-shopping me-2"></i>Shop<span>Verse</span>
      </a>
      <form class="d-flex mx-auto search-input-group flex-grow-1 max-w-600 me-lg-4" id="global-search-form" style="max-width: 550px;">
        <input class="form-control" type="search" id="global-search-input" placeholder="Search across 100+ items..." autocomplete="off">
        <button class="btn btn-search" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        <div id="search-suggestions-box" class="search-suggestions"></div>
      </form>
      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="d-flex align-items-center ms-auto gap-3 py-2 py-lg-0">
          <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fa-solid fa-moon"></i></button>
          <a href="/wishlist.html" class="nav-icon-btn"><i class="fa-solid fa-heart"></i><span class="badge-count" id="wishlist-badge-count" style="display:none;">0</span></a>
          <a href="/cart.html" class="nav-icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cart-badge-count" style="display:none;">0</span></a>
          <div id="auth-nav-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h3 class="fw-bold mb-4" id="cat-title">Shopping Categories</h3>
    
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="categories-full-grid">
      <!-- Rendered via script -->
    </div>
  </main>

  <footer class="py-4 bg-dark text-white text-center mt-auto small">
    <div class="container">&copy; 2026 ShopVerse Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('categories-full-grid');
      try {
        const res = await apiFetch('/categories');
        if (res.success) {
          grid.innerHTML = res.categories.map(cat => `
            <div class="col" onclick="window.location.href='/products.html?category=${encodeURIComponent(cat.name)}'">
              <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 cursor-pointer">
                <img src="${cat.image || 'https://via.placeholder.com/300'}" class="card-img-top" style="height: 180px; object-fit: cover;">
                <div class="card-body">
                  <h5 class="fw-bold mb-1">${cat.name}</h5>
                  <p class="text-muted small mb-2">${cat.description}</p>
                  <span class="text-primary fw-semibold small">Explore ${cat.subcategories ? cat.subcategories.length : 0}+ Subcategories <i class="fa-solid fa-arrow-right ms-1"></i></span>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-12 alert alert-danger">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
